[package]
name = "cavalry-bilingual-gui"
version = "0.1.6"
edition = "2021"
description = "Cavalry Bilingual GUI — Tauri v2 desktop shell for cbpatch"

[lib]
name = "cavalry_bilingual_gui"
path = "src/lib.rs"

[[bin]]
name = "cavalry-bilingual-gui"
path = "src/main.rs"

# src-tauri/ 是 Tauri CLI 实际构建的薄壳 crate（tauri.conf.json 必须与
# Cargo.toml 同目录），挂到同一 workspace 以共享 gui/target 与 Cargo.lock。
[workspace]
members = ["src-tauri"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cbpatch = { path = "../patcher" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same recoverable-delete library used by CavalryKit.
trash = "=5.2.9"
# Explicit HTTP operations only: official update checks and user-approved reports.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls", "json", "system-proxy"] }
regex = "=1.13.1"
semver = "=1.0.28"
sentry-types = "=0.49.3"
