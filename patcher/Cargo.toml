[package]
name = "cbpatch"
version = "0.1.0"
edition = "2021"
description = "Cavalry.app bilingual injector manager (status/apply/restore)"

[lib]
name = "cbpatch"
path = "src/lib.rs"

[[bin]]
name = "cbpatch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
